{% extends "base.html" %}
{% block title %}Willkommen – Legoland DB{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-8 text-center">
    <h1 class="display-4 mb-3">🧱 Legoland DB</h1>
    <p class="lead text-muted">Einfache, sichere Verwaltung deiner Lego-Sammlung im Browser.</p>
    <hr>
    <p>Registriere dich oder melde dich an, um deine Einträge zu verwalten.</p>
    <div class="d-flex gap-3 justify-content-center mt-4">
      <a href="{{ url_for('register') }}" class="btn btn-primary btn-lg">Registrieren</a>
      <a href="{{ url_for('login') }}" class="btn btn-outline-primary btn-lg">Anmelden</a>
    </div>
  </div>
</div>
{% endblock %}
