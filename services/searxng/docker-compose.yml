# ─────────────────────────────────────────────────────────────────────────────
# SearXNG – privacy-respecting metasearch engine
#
# Aggregates results from 70+ search engines without tracking. Configure
# engine categories and weights to focus on deal/discount sites, price
# comparison, or general web search.
#
# Features:
#   - Aggregates Google, Bing, DuckDuckGo, and dozens more
#   - Configurable engine weights and categories
#   - No tracking, no ads, no profiling
#   - Supports custom search shortcuts and bangs
#
# Prerequisites:
#   1. Ensure the shared networks exist: `docker compose -f ../../docker-compose.yml up -d`
#   2. Traefik must be running for HTTPS routing.
#   3. Copy .env.example to .env and set SEARXNG_SECRET_KEY.
#
# Usage:
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────
services:
  searxng:
    image: searxng/searxng:2024.12.23-e69b36cc0
    container_name: searxng
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /etc/searxng:size=8m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 100
    environment:
      - SEARXNG_BASE_URL=https://search.${DOMAIN}
      - SEARXNG_SECRET=${SEARXNG_SECRET_KEY}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.${DOMAIN}`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls.certresolver=letsencrypt"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Redis for caching search results and rate limiting
  searxng-redis:
    image: redis:7-alpine
    container_name: searxng-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 50
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
    name: legoland_proxy
